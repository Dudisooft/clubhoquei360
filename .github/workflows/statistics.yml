name: Verify match statistics
on:
  pull_request:
  push:
    branches: [feat/match-statistics-2026-27]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PLAYWRIGHT_BUNDLED: '1'
      # Review #31 + #32 together without merging backend SQL into this branch.
      - name: Checkout reviewed server dependency for cross-PR verification
        if: github.event.pull_request.head.ref == 'fix/match-mode-access'
        uses: actions/checkout@v4
        with:
          ref: 60d7d1b159e710ca226adad628dc7bf8b9c5059b
          path: work/mode-server-dependency
          persist-credentials: false
      - name: Native PostgreSQL and Chromium cross-PR scenarios
        if: github.event.pull_request.head.ref == 'fix/match-mode-access' || hashFiles('supabase/migrations/*temporary_match_operators.sql') != ''
        env:
          PLAYWRIGHT_BUNDLED: '1'
        run: |
          if [ -f supabase/migrations/20261027183214_temporary_match_operators.sql ]; then
            MODE_SQL_ROOT=supabase/migrations
          else
            MODE_SQL_ROOT=work/mode-server-dependency/supabase/migrations
          fi
          node scripts/verify-match-mode-integration.mjs "$MODE_SQL_ROOT/20261027170248_match_mode_access.sql" "$MODE_SQL_ROOT/20261027183214_temporary_match_operators.sql" "$MODE_SQL_ROOT/20261029040738_revoke_client_truncate.sql"
          node scripts/verify-temporary-integration.mjs "$MODE_SQL_ROOT/20261027170248_match_mode_access.sql" "$MODE_SQL_ROOT/20261027183214_temporary_match_operators.sql" "$MODE_SQL_ROOT/20261029040738_revoke_client_truncate.sql"
